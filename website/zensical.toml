# Zensical configuration for the handbook website.
# scripts/build_site.py copies this file into .site-build/, replaces the nav marker line below
# with the navigation (from the README reading orders), and runs `zensical build`.

[project]
site_name = "Applied AI Handbook"
site_url = "https://anilkerai.github.io/applied-ai-handbook/"
site_description = "Practical, evidence-backed guidance for bringing AI into a business or an engineering team."
site_author = "Anil Kerai"
copyright = "Applied AI Handbook by Anil Kerai, licensed CC BY 4.0"
repo_url = "https://github.com/AnilKerai/applied-ai-handbook"
repo_name = "AnilKerai/applied-ai-handbook"
edit_uri = "edit/main/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/extra.css"]

# @nav: written by scripts/build_site.py

[project.theme]
language = "en"
custom_dir = "overrides"
# System fonts: nothing is fetched from Google Fonts, so pages render without waiting on a
# third-party server, and visitors' browsers don't contact Google.
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/book-open"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Only extensions that read GitHub-flavoured markdown the way GitHub does. Ones that give plain
# characters a new meaning (math for $, subscript for ~, fractions and arrows) stay off.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde.subscript = false
