name: Website

# Builds the handbook website from the markdown on main and publishes it to GitHub Pages:
# https://anilkerai.github.io/applied-ai-handbook/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "zensical==0.1.2"
      - name: Handbook checks
        run: python3 scripts/check.py
      - name: Build the site
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .site-build/site
      - uses: actions/deploy-pages@v5
        id: deployment
